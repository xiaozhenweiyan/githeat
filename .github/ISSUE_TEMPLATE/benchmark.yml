name: Benchmark report
description: Ran githeat on a repository? Add its numbers — the most useful contribution you can make.
title: "benchmarks: <repo> (<N> commits, <X> s)"
labels: ["benchmark"]
body:
  - type: markdown
    attributes:
      value: |
        Numbers from your machine are worth more than anything the maintainer can
        measure alone: cost here depends on history size, disk, OS and git version.

        Produce the row with one command:

        ```
        node scripts/bench.mjs /path/to/repo <label>
        ```

  - type: input
    id: repository
    attributes:
      label: Repository
      placeholder: vuejs/core
    validations:
      required: true

  - type: input
    id: commits
    attributes:
      label: Approximate commit count
      description: "`git rev-list --count HEAD`"
      placeholder: "6532"
    validations:
      required: true

  - type: input
    id: depth
    attributes:
      label: Clone depth
      description: Leave as "full history" if you cloned normally, otherwise the --depth you used.
      placeholder: full history
    validations:
      required: true

  - type: textarea
    id: numbers
    attributes:
      label: The measured row
      description: Paste the markdown row printed by scripts/bench.mjs.
      render: text
      placeholder: "| vuejs/core | 6532 | 810 | 1.45 s | 0.58 s |"
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Node version, git version, and disk type (SSD/HDD/network mount).
      placeholder: "Windows 11, Node 22.23.2, git 2.55.0, SSD"
    validations:
      required: true

  - type: textarea
    id: surprising
    attributes:
      label: Anything surprising
      description: A file that ranked first and clearly should not have, an unexpected memory peak, or simply "it was slow" — that is a bug report, not a complaint.
    validations:
      required: false
