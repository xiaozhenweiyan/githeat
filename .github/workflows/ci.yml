name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # githeat needs real history in the smoke test below

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Unit and integration tests
        run: npm test

      - name: Smoke test on this repository
        run: |
          node bin/githeat.mjs --version
          node bin/githeat.mjs heat . --top 5
          node bin/githeat.mjs heat . --format svg --out smoke.svg
          node bin/githeat.mjs check --quiet

  packaged:
    name: install from the packed tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Pack and install globally
        run: |
          npm pack
          npm i -g ./githeat-*.tgz
          githeat --version
          githeat heat . --top 3
          githeat check --quiet

      - name: The packed package can review a change
        run: |
          # the review path is what the GitHub Action runs; prove it works from
          # the published entry point, not just from a source checkout
          printf 'src/cli.mjs\nsrc/analyze.mjs\n' > changed.txt
          githeat review --changed changed.txt --top 3
          githeat review --changed changed.txt --format json | node -e "
            let s = ''; process.stdin.on('data', d => s += d).on('end', () => {
              const r = JSON.parse(s);
              if (!r.ranked) { console.error('expected at least one ranked changed file'); process.exit(1); }
              console.log('review ok:', r.ranked, 'of', r.changed, 'changed files are ranked');
            });"
